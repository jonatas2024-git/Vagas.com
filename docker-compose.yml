version: '3.8'

services:
  # Banco de Dados PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: vagas_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-vagasuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vagaspass}
      POSTGRES_DB: ${DB_NAME:-vagasdb}
    volumes:
      - vagas-data:/var/lib/postgresql/data

  # Aplicação Backend (Spring Boot)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vagas_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - database
    restart: always

# Volume persistente do banco
volumes:
  vagas-data:
