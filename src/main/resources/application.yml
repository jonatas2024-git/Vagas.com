spring:
  datasource:
    url: jdbc:postgresql://db:5432/vagas
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  sql:
    init:
      mode: always
      platform: postgres
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

server:
  port: 8080

"yaml.validate": false
